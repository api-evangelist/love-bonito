summary: >-
  No .well-known document is served on any Love, Bonito host. The storefront
  (www.lovebonito.com) is a Next.js application whose catch-all route answers 404 with an HTML
  error shell for every /.well-known path — no security.txt, no api-catalog, no OpenID/OAuth
  metadata, no ai-plugin.json, and no A2A agent card. The first-party Kong gateway
  (api.lovebonito.com) answers 401 {"message":"Unauthorized"} on every path including
  /.well-known/*, so nothing there is anonymously readable either. Requests for
  /.well-known/security.txt specifically are intercepted by a Cloudflare WAF rule and answered
  with a 403 challenge page on all hosts. NO WellKnown OR SecurityTxt POINTER IS EMITTED —
  this file records a measured absence, not a served surface.
