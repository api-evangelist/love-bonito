aid: love-bonito
name: Love Bonito
description: >-
  Love, Bonito is a Singapore-headquartered direct-to-consumer womenswear brand, founded in 2010 out
  of the BonitoChico blogshop and now one of Southeast Asia's largest vertically integrated fashion
  labels. It designs, manufactures and retails women's apparel — Signatures, Staples and Capsule
  collections spanning tops, dresses, bottoms, matching sets, petites and maternity — through its own
  e-commerce storefront, iOS/Android shopping apps and physical stores across Singapore, Malaysia,
  Indonesia, Hong Kong, Cambodia and the Philippines. The commerce stack is a Next.js storefront on a
  Magento-derived backend with Storyblok for content, fronted by Cloudflare, with an internal Kong API
  gateway at api.lovebonito.com serving its own first-party apps. Love, Bonito publishes no public
  developer program, API reference, or machine-readable contract; its partner surface is an affiliate
  program run through third-party networks (Impact, FlexOffers), not a first-party API.
