note: >-
  No rate limits are published, and none are observable. Love, Bonito operates no public API, so
  there is no documented quota, window, burst, or exhaustion status code to record. Its
  first-party Kong gateway at api.lovebonito.com refuses every anonymous request with HTTP 401
  {"message":"Unauthorized"} before any limit is reached, and returns no X-RateLimit-*,
  RateLimit-*, or Retry-After headers on that response — only x-kong-response-latency. The
  storefront edge (Cloudflare) does apply an undocumented bot/abuse policy: repeated automated
  GETs against www.lovebonito.com began receiving HTTP 403 challenge pages partway through this
  pass. That is a WAF policy, not a published API rate limit, and it is recorded here as an
  observation rather than as a limit.
